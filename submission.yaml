submission:
  title: "Grid Failure Advisor"

  problem_statement: >
    Utilities run calendar-based maintenance on transformers and substations even
    though sensors already measuring temperature, vibration, partial discharge, and
    oil quality show failure signatures weeks in advance. Weather forecasts that
    compound that risk are never combined with sensor data in time to act, so a
    single major asset failure causes blackouts costing $1M+/hour and stranding
    tens of thousands of customers.

  solution_summary: >
    Grid Failure Advisor fuses asset sensor telemetry, 7-day weather forecasts, and
    historical incident records into one explainable composite risk score per
    asset, ranks assets by grid impact severity, and generates a prioritized
    maintenance and crew pre-positioning plan timed against incoming severe
    weather. A Grid Copilot lets an operator — or IBM Bob itself, via a standalone
    MCP server exposing the same tools — ask natural-language questions answered
    from real, grounded tool calls, not a hallucinated guess.

  key_features:
    - "Explainable composite risk scoring: every point on a 0-100 score is traced to a named factor (sensor anomaly per metric, weather risk, historical incident rate) with a plain-language explanation, not a black-box prediction"
    - "Sensor anomaly detection across 4 metrics (temperature, vibration, partial discharge, oil quality) using each asset's own 15-day baseline, surfacing degradation signatures before failure"
    - "Weather-timed maintenance and crew pre-positioning plan that pulls recommended action dates forward ahead of a forecast storm in the asset's region"
    - "Grid Copilot: a natural-language chat backed by an MCP server — the exact same tool functions are callable independently by IBM Bob or any MCP client, proving the integration is load-bearing, not name-dropped"
    - "Deterministic copilot routing with zero dependency on a live LLM API key, so the demo never breaks on Wi-Fi or a missing credential"

  tech_stack:
    languages: ["Python", "TypeScript"]
    frameworks: ["FastAPI", "React", "Vite", "Tailwind CSS"]
    ibm_technologies: ["IBM Bob", "Model Context Protocol (MCP)"]
    databases: []
    other: ["Uvicorn", "Pydantic", "Recharts", "pytest", "Playwright (verification)"]

  what_we_are_most_proud_of: >
    The risk engine's explainability: docs/architecture.md and the live
    "Why This Score" panel show every point of every asset's score traced to a
    named, human-readable factor, and the synthetic data is generated so the
    top-ranked asset always has both a genuine degrading sensor trend AND an
    upcoming storm in its region — the "weeks in advance, combined with weather"
    story from the problem statement is verifiably true in the running app, not
    just claimed. Equally: the MCP server and the in-app Grid Copilot share one
    implementation (app/services/grid_tools.py), so a judge can independently
    call get_at_risk_assets over MCP and get the exact numbers the dashboard shows.

  known_limitations: >
    All data is synthetic (deterministic, seeded generator) — no real utility
    dataset was available in the build window; the risk model is intentionally
    rule-based/statistical rather than a trained ML model, for explainability and
    speed under time pressure (documented as an explicit, upgradeable design
    decision). No map visualization, authentication, or persistent database —
    data is regenerated JSON/CSV loaded into memory. No live deployment; run
    locally per docs/setup-guide.md. The Grid Copilot uses a deterministic
    keyword/intent router rather than a full LLM, by design, so the demo has zero
    dependency on a live API key.

