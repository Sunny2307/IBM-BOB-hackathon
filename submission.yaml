submission:
  title: "Grid Failure Advisor"

  problem_statement: >
    Utilities run calendar-based maintenance on transformers and substations even
    though sensors already measuring temperature, vibration, partial discharge, and
    oil quality show failure signatures weeks in advance. Weather forecasts that
    compound that risk are never combined with sensor data in time to act, so a
    single major asset failure causes blackouts costing $1M+/hour and stranding
    tens of thousands of customers.

  solution_summary: >
    Grid Failure Advisor fuses asset sensor telemetry, 7-day weather forecasts, and
    historical incident records into one explainable composite risk score per
    asset, ranks assets by grid impact severity, plots them on a live risk map, and
    generates a prioritized maintenance and crew pre-positioning plan timed against
    incoming severe weather. Sensor data drifts continuously via a background
    simulator so the dashboard reflects change over time rather than a frozen
    snapshot. A Grid Copilot lets an operator — or IBM Bob itself, via a standalone
    MCP server exposing the same tools — ask natural-language questions; it first
    tries a Groq-hosted LLM with tool-calling grounded on the same real data
    functions (so it cannot invent numbers), and falls back to a deterministic
    keyword router if no LLM key is configured or the call fails, so the demo never
    depends on a live third-party API key to work correctly.

  key_features:
    - "Alerts that reach a named human: a background monitor raises an alert the moment an asset CROSSES UP into High or Critical (not merely is Critical, which would re-fire every 13 seconds), routes it to whoever is assigned that region, and the Flutter app raises a device notification. One tap acknowledges it, and the record then shows who owns the response - closing the crew pre-positioning half of the problem statement that a ranked list alone leaves open"
    - "Multi-tenant operator layer on Postgres: companies, administrators and field crew, with scrypt-hashed passwords, JWT roles, and company scoping taken from the signed token on every query rather than from the request - with a dedicated cross-tenant isolation test"
    - "A copilot that can act, not just answer: signed in, the Grid Copilot gains four more grounded tools including acknowledge_alert, so an operator can say \"I'll take alert 9 and tell me why it fired\" and have it done. Identity is bound server-side from the JWT, so an injected instruction in a tool result cannot make the model act as another crew member"
    - "Degrades cleanly: with no DATABASE_URL the dashboard, risk engine, copilot and MCP server all still work and only the operator routes report 503 - the same discipline as the weather and LLM fallbacks"
    - "Live 7-day weather per region from the keyless Open-Meteo API, cached and background-refreshed, with automatic fallback to a seeded forecast on any failure - every weather consumer in the app (risk engine, planner, MCP tools, Copilot, UI) reads through one function, so the whole system runs on real weather"
    - "Continuous, asset-specific weather risk: severity scales with how bad the worst forecast day is, how soon it is, and how vulnerable that asset is (age, N-1 redundancy) - and heat counts, so a 98F day stressing loaded equipment is scored rather than ignored by a storm flag"
    - "Explainable composite risk scoring: every point on a 0-100 score is traced to a named factor (sensor anomaly per metric, weather risk, historical incident rate) with a plain-language explanation, not a black-box prediction"
    - "Sensor anomaly detection across 4 metrics (temperature, vibration, partial discharge, oil quality) using each asset's own 15-day baseline, surfacing degradation signatures before failure"
    - "Weather-timed maintenance and crew pre-positioning plan that pulls recommended action dates forward ahead of a forecast storm in the asset's region"
    - "Live risk map (Leaflet/OpenStreetMap) plotting every asset by location, colored by risk tier, alongside stat tiles and skeleton-loading states on the dashboard"
    - "Grid Copilot with an optional Groq LLM tool-calling layer: the model calls the exact same grounded functions (get_at_risk_assets, explain_asset_risk, get_maintenance_plan, list_regions) exposed to IBM Bob via MCP — one implementation shared by the in-app chat, the LLM tool layer, and the MCP server, so the integration is load-bearing, not name-dropped"
    - "Deterministic keyword-router fallback with zero dependency on a live LLM API key — if Groq is unset or a call fails, the copilot still answers correctly from the same grounded tools, so the demo never breaks on Wi-Fi or a missing credential"
    - "Background live-data simulator that drifts sensor readings and risk scores every ~13 seconds, so the dashboard visibly updates without a restart"

  tech_stack:
    languages: ["Python", "TypeScript", "Dart"]
    frameworks: ["FastAPI", "React", "Vite", "Tailwind CSS", "Flutter"]
    ibm_technologies: ["IBM Bob", "Model Context Protocol (MCP)"]
    databases: ["PostgreSQL (Neon serverless) - operator layer only"]
    other: ["Uvicorn", "Pydantic", "httpx", "Groq API (openai/gpt-oss-120b, tool-calling, free tier)", "Leaflet / react-leaflet", "Recharts", "pytest", "Playwright (verification)"]

  what_we_are_most_proud_of: >
    The risk engine's explainability: docs/architecture.md and the live
    "Why This Score" panel show every point of every asset's score traced to a
    named, human-readable factor, and the synthetic data is generated so the
    top-ranked asset always has both a genuine degrading sensor trend AND an
    upcoming storm in its region — the "weeks in advance, combined with weather"
    story from the problem statement is verifiably true in the running app, not
    just claimed. Equally: the MCP server and the in-app Grid Copilot share one
    implementation (app/services/grid_tools.py), so a judge can independently
    call get_at_risk_assets over MCP and get the exact numbers the dashboard shows.

  known_limitations: >
    The read API (/assets, /maintenance-plan, /copilot/ask) is deliberately
    public so a judge can open the deployed demo with no account; everything
    under /auth, /alerts and /admin requires a token. A production deployment
    would put the read API behind the same boundary. Mobile notifications are
    LOCAL (the app polls /alerts/mine and raises them itself) rather than FCM
    push, so no Firebase project is needed to run it but nothing arrives while
    the app is force-killed - the alerts table is where real push plugs in.
    Sensor telemetry and historical incidents remain synthetic; weather is live.
    All data is synthetic (deterministic, seeded generator plus a small bounded
    live-drift simulator) — no real utility dataset was available in the build
    window; the risk model is intentionally rule-based/statistical rather than a
    trained ML model, for explainability and speed under time pressure (documented
    as an explicit, upgradeable design decision). No authentication or persistent
    database — data lives in memory for the life of the process. Deployed on
    free-tier hosting (Render backend, Vercel frontend); a self-ping keeps the
    backend from sleeping, but if it's ever unreachable, run locally per
    docs/setup-guide.md instead. The Grid Copilot's LLM path
    requires a free Groq API key to be configured (GROQ_API_KEY in
    src/backend/.env); without one it automatically uses the original
    deterministic keyword router instead, which covers the three core query
    types (highest risk, why an asset is risky, maintenance plan) but not
    open-ended follow-up questions.

